[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search"
version = "0.1.0"
description = "CLI-first multi-source web research with xAI/OpenAI-compatible search, Exa, Context7, Tavily, Firecrawl, AnySearch, and Deep Research planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.28.0",
    "InquirerPy>=0.3.4,<0.4",
    "pyfiglet>=1.0,<2",
    "rich>=13.9,<16",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_search = [
    "assets/skills/agent-search-cli/SKILL.md",
    "assets/skills/agent-search-cli/agents/*.yaml",
    "assets/skills/agent-search-cli/references/*.md",
]

[project.scripts]
agent-search = "agent_search.cli:main"
